name: L4G · Creative studio — Seedance 2.5
on:
  push:
    branches: [main]
    paths: ['assets/seedance/studio.json', '.github/workflows/studio-media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l4g-studio-media
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install integration
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Install video optimizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate authorized L4G assets with Seedance 2.5
        env:
          HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
        run: python scripts/generate_site_media.py --spec assets/seedance/studio.json --output web/public/media/studio
      - name: Save optimized assets in repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/media/studio
          if ! git diff --cached --quiet; then
            git commit -m 'Add cinematic creative studio assets from Seedance 2.5'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: l4g-studio-media
          path: web/public/media/studio/
          if-no-files-found: ignore
