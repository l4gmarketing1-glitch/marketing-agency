name: L4G · Website checks & preview
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: l4g-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser, accessibility and SEO checks
        run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: l4g-production-site
          path: web/dist/
          retention-days: 7
  preview:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Build non-indexable preview
        working-directory: web
        run: |
          npm ci
          npm run build
          node scripts/prepare-preview.mjs
      - name: Upload website for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist/
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
