name: L4G · Seedance 2.5 website media
on:
  push:
    branches: [main]
    paths: ['assets/seedance/hero.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l4g-seedance-media
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Generate authorized L4G assets with Seedance 2.5
        env:
          HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
        run: python scripts/generate_site_media.py
      - name: Save optimized assets in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/media
          if ! git diff --cached --quiet; then
            git commit -m 'Add L4G visuals generated with Seedance 2.5'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l4g-seedance-media
          path: web/public/media/
          if-no-files-found: ignore
